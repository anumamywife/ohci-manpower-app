name: Build and Release Signed APK
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Dependencies
        run: npm install

      - name: Add Android Platform
        run: npx cap add android || true

      - name: Generate App Icons
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff' || true

      - name: Add Location Permissions
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <application#' android/app/src/main/AndroidManifest.xml

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Unsigned APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Restore Keystore Safely
        env:
          KEY_DATA: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          python3 -c "
          import os, base64
          raw = os.environ['KEY_DATA'].strip()
          clean_b64 = ''.join([l for l in raw.splitlines() if not l.startswith('---')]).replace(' ', '').replace('\n', '').replace('\r', '')
          with open('release-key.jks', 'wb') as f:
              f.write(base64.b64decode(clean_b64))
          "
          ls -lh release-key.jks

      - name: Sign APK with apksigner
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          UNSIGNED_APK=$(find android/app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          echo "Found APK: $UNSIGNED_APK"
          
          APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools/ -name apksigner | sort -V | tail -n 1)
          echo "Using apksigner at: $APKSIGNER"
          
          "$APKSIGNER" sign \
            --ks release-key.jks \
            --ks-key-alias "$KS_ALIAS" \
            --ks-pass env:KS_PASS \
            --key-pass env:KS_PASS \
            --out app-release.apk \
            "$UNSIGNED_APK"
          
          "$APKSIGNER" verify --verbose app-release.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ohci-bus-app
          path: app-release.apk

      - name: Release APK to GitHub Release
        uses: softprops/action-gh-release@v1
        if: github.ref == 'refs/heads/main'
        with:
          files: app-release.apk
          tag_name: "1.01"
          name: "Release v1.01"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
